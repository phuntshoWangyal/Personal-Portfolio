<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi lad</title>
    <link rel="stylesheet" href="styling.css">
    <link rel="stylesheet" href="index.html">
</head>
<body>
   
    <div class="log">
       
        <div class="form-box">
            <div class="collapse navbar-collapse " id="navbarNav">
                <ul class="navbar-nav ms-auto text-center ">
                  <li class="nav-item">
                    <a class="nav-link fs-1 mynav1" href="index.html" id="home"><img src="img/crossbutton.jpg" alt="img" style="width: 20px; height: 20px; align-items: flex-end;"></a>
                  </li>
                
            </div>
            <div class="button-box">
                <div id="btn"></div>
                <button type="button" class="toggle-btn" onclick="login()">login</button>
                <button type="button" class="toggle-btn" onclick="register()">Register</button>
            </div>
           
            <form id="login" class="input-group">
                <input type="text" class="input-field" placeholder="user Id" required>
                <input type="text" class="input-field" placeholder="Enter Password" required>
                <input type="checkbox" class="check-box"> <span id="rmbr"><p>Remember Password</p></span>
                <button type="submit" class="submit-btn">Login</button>

                
            </form> 
            <form id="register" class="input-group">
                <input type="text" class="input-field" placeholder="user Id" required>
                <input type="text" class="input-field" placeholder="Email Id" required>
                <input type="text" class="input-field" placeholder="Enter Password" required>
                <input type="checkbox" class="check-box"> <span>Remember password</span>
                <button type="submit" class="submit-btn">Register</button>
            </form> 
            <div class="social-icon">
                <img src="img/facebook-icon.png" alt="img">
                <img src="img/instagram-icon.png" alt="img">
                <img src="img/twitter-icon.png" alt="img">
                 
            </div>
        </div>
       
    </div>
    <script>
        var x = document.getElementById("login");
        var y = document.getElementById("register");
        var z = document.getElementById("btn");

        function register(){
            x.style.left = "-400px";
            y.style.left = "50px";
            z.style.left = "110px";

        }
        function login(){
            x.style.left = "50px";  
            y.style.left = "450px";
            z.style.left = "0px";

        }
        function openTheForm() {
            document.getElementById("popupForm").style.display = "block";
        }

        function closeTheForm() {
            document.getElementById("popupForm").style.display = "none";
        }
    </script>
    
</body>
</html>
